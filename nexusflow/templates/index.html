<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusFlow — Dashboard</title>
<style>
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #c9d1d9; --text-muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
  h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
  h1 small { font-size: 1rem; color: var(--text-muted); font-weight: 400; }
  p { color: var(--text-muted); margin-bottom: 2rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
  .card h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th, td { text-align: left; padding: 0.5rem 0.25rem; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 500; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .badge-success { background: #1b3a2b; color: var(--green); }
  .badge-failed { background: #3d1a1a; color: var(--red); }
  .badge-pending { background: #1c2333; color: var(--accent); }
  .badge-running { background: #1c1f2b; color: var(--yellow); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: var(--text-muted); font-style: italic; padding: 1rem 0; }
  .flash { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
</style>
</head>
<body>
  <h1>⚡ NexusFlow <small>v0.1.0</small></h1>
  <p>DAG-based workflow orchestration engine — Dashboard</p>
  <div class="grid">
    <div class="card">
      <h2>📋 Workflows</h2>
      <div id="workflows-list">Loading...</div>
    </div>
    <div class="card">
      <h2>🕐 Recent Executions</h2>
      <div id="executions-list">Loading...</div>
    </div>
  </div>
  <script>
    const WORKFLOWS = {{ workflows }};
    const EXECUTIONS = {{ executions }};

    function badge(status) {
      const cls = 'badge badge-' + status;
      return `<span class="${cls}">${status}</span>`;
    }

    function renderWorkflows() {
      const el = document.getElementById('workflows-list');
      if (WORKFLOWS.length === 0) { el.innerHTML = '<div class="empty">No workflows defined yet.</div>'; return; }
      let html = '<table><thead><tr><th>Name</th><th>ID</th><th>Created</th></tr></thead><tbody>';
      for (const wf of WORKFLOWS) {
        html += `<tr><td><a href="/workflows/${wf.id}">${wf.name || '(unnamed)'}</a></td><td><code>${wf.id.slice(0,12)}</code></td><td>${new Date(wf.created_at * 1000).toLocaleString()}</td></tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    function renderExecutions() {
      const el = document.getElementById('executions-list');
      if (EXECUTIONS.length === 0) { el.innerHTML = '<div class="empty">No executions yet.</div>'; return; }
      let html = '<table><thead><tr><th>ID</th><th>Workflow</th><th>Status</th><th>Started</th></tr></thead><tbody>';
      for (const ex of EXECUTIONS.slice(0, 20)) {
        html += `<tr><td><a href="/executions/${ex.id}">${ex.id.slice(0,12)}</a></td><td><code>${ex.workflow_id.slice(0,12)}</code></td><td>${badge(ex.status)}</td><td>${ex.started_at ? new Date(ex.started_at * 1000).toLocaleString() : '—'}</td></tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    renderWorkflows();
    renderExecutions();
  </script>
</body>
</html>
