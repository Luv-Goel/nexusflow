<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusFlow — Workflow</title>
<style>
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #c9d1d9; --text-muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; --orange: #db6d28; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
  .btn { display: inline-block; padding: 0.4rem 1rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.85rem; margin-right: 0.5rem; }
  .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn-primary:hover { background: #388bfd; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #dag-container { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; height: 500px; margin: 1rem 0; position: relative; overflow: hidden; }
  #dag-container svg { width: 100%; height: 100%; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin: 1rem 0; }
  .card h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th, td { text-align: left; padding: 0.5rem 0.25rem; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 500; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .badge-success { background: #1b3a2b; color: var(--green); }
  .badge-failed { background: #3d1a1a; color: var(--red); }
  .badge-pending { background: #1c2333; color: var(--accent); }
  .badge-running { background: #1c1f2b; color: var(--yellow); }
  .badge-skipped { background: #1c1f2b; color: var(--text-muted); }
  .badge-timeout { background: #3d1a1a; color: var(--orange); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: var(--text-muted); font-style: italic; padding: 1rem 0; }
  #run-result { margin-top: 0.75rem; padding: 0.75rem; border-radius: 6px; display: none; }
  #run-result.success { display: block; background: #1b3a2b; color: var(--green); border: 1px solid var(--green); }
  #run-result.failed { display: block; background: #3d1a1a; color: var(--red); border: 1px solid var(--red); }
</style>
</head>
<body>
  <a href="/" style="font-size:0.85rem;">&larr; Back to Dashboard</a>
  <h1>📊 Workflow: <span id="wf-name">—</span></h1>
  <div class="subtitle">ID: <code id="wf-id">{{ workflow_id }}</code></div>
  <button class="btn btn-primary" id="run-btn" onclick="triggerRun()">▶  Run Now</button>
  <div id="run-result"></div>

  <div id="dag-container"><svg id="dag-svg"></svg></div>

  <div class="card">
    <h2>🕐 Executions</h2>
    <div id="executions-table">Loading...</div>
  </div>

  <script>
    const GRAPH = {{ graph_json }};
    const EXECUTIONS = {{ executions }};
    const WF_ID = '{{ workflow_id }}';

    function badge(status) {
      return `<span class="badge badge-${status}">${status}</span>`;
    }

    // ── DAG visualisation (pure SVG) ───────────────────────────────────
    function renderDAG(graph) {
      const svg = document.getElementById('dag-svg');
      const W = svg.clientWidth || 900;
      const H = svg.clientHeight || 500;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

      if (!graph || !graph.nodes || graph.nodes.length === 0) {
        svg.innerHTML = '<text x="'+(W/2-80)+'" y="'+(H/2)+'" fill="#8b949e" font-size="14">No nodes to display</text>';
        return;
      }

      // Layered layout: assign nodes to tiers based on level
      const nodes = {};
      for (const n of graph.nodes) nodes[n.id] = n;

      // Build adjacency to compute levels
      const inDegree = {};
      const outEdges = {};
      for (const n of graph.nodes) { inDegree[n.id] = 0; outEdges[n.id] = []; }
      for (const e of (graph.edges || [])) {
        outEdges[e.source] = outEdges[e.source] || [];
        outEdges[e.source].push(e.target);
        inDegree[e.target] = (inDegree[e.target] || 0) + 1;
      }

      // Topological sort for level assignment (Kahn's)
      const levels = {};
      let queue = [];
      for (const n of graph.nodes) if (inDegree[n.id] === 0) queue.push(n.id);
      let lvl = 0;
      while (queue.length > 0) {
        const next = [];
        for (const nid of queue) {
          levels[nid] = lvl;
          for (const tgt of (outEdges[nid] || [])) {
            inDegree[tgt]--;
            if (inDegree[tgt] === 0) next.push(tgt);
          }
        }
        queue = next;
        lvl++;
      }

      // Position calculation
      const levelCounts = {};
      const levelIndex = {};
      for (const [nid, l] of Object.entries(levels)) {
        levelCounts[l] = (levelCounts[l] || 0) + 1;
        levelIndex[nid] = levelCounts[l] - 1;
      }

      const maxLevel = Math.max(...Object.values(levels), 0);
      const padX = 80, padY = 60;
      const nodeW = 120, nodeH = 36;
      const spacingX = (W - 2 * padX) / (maxLevel + 1);
      const positions = {};

      for (const [nid, l] of Object.entries(levels)) {
        const count = levelCounts[l] || 1;
        const idx = levelIndex[nid];
        const x = padX + l * spacingX;
        const y = padY + (idx + 0.5) * (H - 2 * padY) / count;
        positions[nid] = { x, y };
      }

      // Draw edges (lines)
      let edgeHtml = '';
      const statusColors = { success: '#3fb950', failed: '#f85149', running: '#d29922', pending: '#30363d', skipped: '#484f58', timeout: '#db6d28' };
      for (const e of (graph.edges || [])) {
        const src = positions[e.source], tgt = positions[e.target];
        if (src && tgt) {
          edgeHtml += `<line x1="${src.x}" y1="${src.y + nodeH/2}" x2="${tgt.x}" y2="${tgt.y - nodeH/2}" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>`;
        }
      }

      // Draw nodes (rectangles)
      let nodeHtml = '';
      for (const n of graph.nodes) {
        const pos = positions[n.id];
        if (!pos) continue;
        const c = statusColors[n.status] || '#30363d';
        const statusLabel = n.status || 'pending';
        nodeHtml += `<g><rect x="${pos.x - nodeW/2}" y="${pos.y - nodeH/2}" width="${nodeW}" height="${nodeH}" rx="6" fill="#161b22" stroke="${c}" stroke-width="2"/>
          <text x="${pos.x}" y="${pos.y + 4}" text-anchor="middle" fill="#c9d1d9" font-size="12" font-family="sans-serif">${n.name || n.id.slice(0,10)}</text>
          <title>${n.name} (${n.id})\nStatus: ${statusLabel}\nRetries: ${n.retries || 0}</title></g>`;
      }

      svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>${edgeHtml}${nodeHtml}`;
      document.getElementById('wf-name').textContent = graph.name || '(unnamed)';
    }

    // ── Executions table ───────────────────────────────────────────────
    function renderExecutions() {
      const el = document.getElementById('executions-table');
      if (!EXECUTIONS || EXECUTIONS.length === 0) {
        el.innerHTML = '<div class="empty">No executions yet. Click "Run Now" to start one.</div>';
        return;
      }
      let html = '<table><thead><tr><th>ID</th><th>Status</th><th>Started</th><th>Finished</th><th>Error</th></tr></thead><tbody>';
      for (const ex of EXECUTIONS) {
        html += `<tr><td><a href="/executions/${ex.id}">${ex.id.slice(0,12)}</a></td><td>${badge(ex.status)}</td><td>${ex.started_at ? new Date(ex.started_at * 1000).toLocaleString() : '—'}</td><td>${ex.finished_at ? new Date(ex.finished_at * 1000).toLocaleString() : '—'}</td><td style="color:var(--red);font-size:0.8rem;">${ex.error || ''}</td></tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    // ── Trigger run ────────────────────────────────────────────────────
    async function triggerRun() {
      const btn = document.getElementById('run-btn');
      const result = document.getElementById('run-result');
      btn.disabled = true;
      result.className = '';
      result.style.display = 'none';
      result.textContent = 'Running...';
      result.style.display = 'block';

      try {
        const resp = await fetch(`/api/workflows/${WF_ID}/run`, { method: 'POST' });
        const data = await resp.json();
        result.className = data.status === 'success' ? 'success' : 'failed';
        result.innerHTML = `<strong>${data.status.toUpperCase()}</strong>: Execution ${data.execution_id.slice(0,12)} completed. <a href="/executions/${data.execution_id}">View details</a>`;
        // Reload executions
        location.reload();
      } catch (err) {
        result.className = 'failed';
        result.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    // ── Init ───────────────────────────────────────────────────────────
    renderDAG(GRAPH);
    renderExecutions();
  </script>
</body>
</html>
