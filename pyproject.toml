[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nexusflow"
version = "0.1.0"
description = "Lightweight DAG-based workflow orchestration engine"
readme = "README.md"
license = {file = "LICENSE.txt"}
authors = [
    {name = "NexusFlow Contributors"},
]
keywords = ["workflow", "dag", "orchestration", "etl", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # Zero runtime deps beyond stdlib!
    # FastAPI/uvicorn are optional (needed only for the web UI).
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "click>=8",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
]

[project.scripts]
nexusflow = "nexusflow.cli:cli"

[tool.setuptools.packages.find]
include = ["nexusflow*"]

[tool.setuptools.package-data]
nexusflow = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
